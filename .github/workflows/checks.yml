name: Checks

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat
          needs: check

      - name: Run tests
        run: Rscript tests/testthat.R

      - name: Validate app syntax
        run: |
          parse(file = "R/obfuscator_core.R")
          parse(file = "R/shiny_app.R")
          parse(file = "app.R")
        shell: Rscript {0}
